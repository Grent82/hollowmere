<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hollowmere</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23d6aa5a%22/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English+SC&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main id="app">
      <section id="stage">
        <canvas id="map"></canvas>
        <div id="hover"></div>
        <div id="banner"></div>
      </section>
      <aside id="side">
        <header>
          <h1>Hollowmere</h1>
          <div id="clock">—</div>
          <div id="controls">
            <button id="pause" title="Pause / resume (space)">❚❚</button>
            <span id="speeds"></span>
          </div>
          <div id="llm"></div>
        </header>
        <nav id="tabs">
          <button data-tab="folk" class="on">Townsfolk</button>
          <button data-tab="chronicle">Chronicle</button>
        </nav>
        <div id="folk" class="tab on"></div>
        <div id="chronicle" class="tab"></div>
        <div id="detail" hidden></div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
